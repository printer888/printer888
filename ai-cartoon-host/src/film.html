  <rect x="-300" y="-300" width="1680" height="2600" fill="url(#wallG)"/>

// ───────── DIRECTION: Max acting ─────────
const POSE = {
  type: [{ x: -55, y: -40 }, { x: 55, y: -40 }],
  rest: [{ x: -80, y: -30 }, { x: 80, y: -30 }],
  gestR: [{ x: -55, y: -40 }, { x: 95, y: -215 }],
  gestL: [{ x: -95, y: -215 }, { x: 55, y: -40 }],
  pointUp: [{ x: -55, y: -40 }, { x: 125, y: -390 }],
  pointBoth: [{ x: -130, y: -360 }, { x: 130, y: -360 }],
  shrug: [{ x: -195, y: -205 }, { x: 195, y: -205 }],
  chin: [{ x: -55, y: -40 }, { x: 18, y: -280 }],
  wave: [{ x: -55, y: -40 }, { x: 170, y: -330 }],
  open: [{ x: -165, y: -180 }, { x: 165, y: -180 }],
  you: [{ x: -55, y: -40 }, { x: 40, y: -230 }],

function poseAt(keys, t, ease = .28) { let A = POSE[keys[0][1]].map(o => ({ ...o }));
  for (let i = 1; i < keys.length; i++) { const [tk, pn] = keys[i]; if (t < tk) break; const u = eio(p01(t, tk, tk + ease)), B = POSE[pn]; A = A.map((o, j) => ({ x: lerp(o.x, B[j].x, u), y: lerp(o.y, B[j].y, u) })); }
  return A; }
function KF(keys, t, ease = .25) { let cur = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const [tk, v] = keys[i]; if (t < tk) break; const u = sstep(p01(t, tk, tk + ease)); const o = {}; for (const k in v) o[k] = lerp(cur[k] ?? 0, v[k], u); cur = Object.assign({}, cur, o); }
  return cur; }
function blinkAt(t) { let b = 0; for (let k = 0; k < 40; k++) { const bt = .9 + k * 2.6 + hash(k * 7) * 1.8; const d = t - bt; if (d > 0 && d < .16) b = Math.max(b, Math.sin(d / .16 * Math.PI)); } return b; }
let D = {};
function direct() {
  const L = Ln, W = Wd;
  D.expr = [[0, { smile: .2, brow: .4, furrow: .3, lookX: 0, lookY: 0, wide: 0, tilt: 0, squint: 0 }],
    [W('hook', 'search').s, { smile: -.1, brow: .6, furrow: .5, tilt: -4 }], [W('hook', "that's").s, { smile: -.35, brow: -.1, furrow: .6, tilt: 3, lookX: .3 }],
    [L('intro').s, { smile: .7, brow: .5, furrow: 0, tilt: 0, lookX: 0 }], [L('t1').s, { smile: .45, brow: .3 }], [W('t1b', 'claude').s, { smile: .8, squint: .3, brow: .5 }],
    [L('t2').s, { smile: .45, squint: 0, brow: .3 }], [W('t2b', 'even').s, { smile: .7, brow: .8, wide: .3 }], [L('t3').s, { smile: .5, wide: 0, brow: .4 }],
    [W('t3b', 'real').s, { smile: .9, wide: .5, brow: .9 }], [L('t4').s, { smile: -.2, brow: .2, furrow: .5, wide: 0 }], [W('t4', 'edit').s, { smile: .55, furrow: 0, brow: .5 }],
    [L('t5').s, { smile: .7, brow: .6, tilt: 3 }], [W('t5', 'ask').s, { smile: .5, brow: .3, tilt: 0, lookY: -.2 }], [L('t5b').s, { smile: 1, squint: .4, brow: .6, lookY: 0 }],
    [L('end1').s, { smile: .55, squint: 0, brow: .7, tilt: -4, lookX: 0 }], [L('end2').s, { smile: .75, brow: .4, tilt: 0 }]];
  D.pose = [[0, 'type'], [W('hook', 'search').s, 'gestR'], [W('hook', "that's").s, 'shrug'], [L('intro').s + .1, 'type'], [W('intro', 'five').s - .1, 'pointUp'], [L('intro').e + .1, 'type'],
    [W('t1', 'plus').s, 'gestR'], [L('t1').e + .1, 'type'], [W('t1b', 'claude').s, 'open'], [L('t1b').e, 'type'], [L('t2').s + .2, 'gestL'], [L('t2').e, 'type'],
    [W('t2b', 'even').s, 'pointUp'], [L('t2b').e + .1, 'type'], [L('t3').s + .3, 'gestR'], [L('t3').e, 'type'], [W('t3b', 'real').s, 'open'], [L('t3b').e, 'type'],
    [L('t4').s, 'shrug'], [W('t4', 'edit').s - .1, 'type'], [W('t4', 'instead').s, 'gestL'], [L('t4').e, 'type'], [L('t5').s, 'pointUp'], [W('t5', 'end').s, 'type'],
    [L('t5b').s, 'open'], [L('t5b').e, 'type'], [L('end1').s, 'chin'], [W('end1', 'tell').s, 'you'], [L('end2').s, 'type'], [W('end2', 'follow').s, 'wave'], [L('end2').e + .4, 'rest']];
  // typing windows (hands jitter + key sfx)
  D.typing = [[0, W('hook', 'search').s], [W('t3', 'ask').s, L('t3').e], [W('t4', 'edit').s, W('t4', 'instead').s], [W('t5', 'end').s, L('t5').e]];
}
function stateMax(t) {
  const l = LINES.find(l => t >= l.s - .1 && t <= l.e + .15);
  const mouth = l ? visemeAt(l.phones, t) : null;
  let beat = 0; if (l) for (const w of WORDS) if (w.li === l.i) beat = Math.max(beat, pulse(t, w.s + .05, .09) * (w.e - w.s > .25 ? 1 : .4));
  const e = KF(D.expr, t);
  const st = Object.assign({ t, x: 540, y: 1745, scale: 1.36, stand: 0, blink: blinkAt(t), mouth, nod: beat * 5, glow: .3 }, e);

<!doctype html>
<html><head><meta charset="utf-8"><title>AI Money Duel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07060f}
#world{position:absolute;inset:0}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;transform-origin:0 0}
.layer svg{position:absolute;left:0;top:0;overflow:visible}
#grade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#warm{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,140,60,.06),rgba(80,40,140,.08));mix-blend-mode:soft-light}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
/* inserts */
#ins{position:absolute;inset:0;pointer-events:none}
.scr{position:absolute;left:50px;top:290px;width:980px;height:1010px;border-radius:34px;background:#0b0b0d;border:14px solid #1b1c20;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 2px #2c2e35;overflow:hidden;opacity:0;transform-origin:50% 50%}
.scr .gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);pointer-events:none}
.td{position:absolute;inset:0;background:#0d1117;font-family:Inter;color:#c9d1d9}
.td .hd{height:84px;display:flex;align-items:center;gap:20px;padding:0 30px;border-bottom:2px solid #21262d;font-size:28px;font-weight:700}
.badge{padding:6px 14px;border-radius:10px;font-size:20px;font-weight:800}
/* claude mock */
.cl{position:absolute;inset:0;background:#262624;color:#ECEAE2;font-family:Inter}
.cl .side{position:absolute;left:0;top:0;bottom:0;width:200px;background:#1E1D1B;border-right:2px solid #2d2c2a;padding:26px 18px}
.cl .brand{display:flex;align-items:center;gap:10px;font-family:"Liberation Serif",Georgia,serif;font-size:32px;margin-bottom:28px}
.cl .nav{font-size:22px;padding:11px 8px;color:#ECEAE2;display:flex;gap:10px;align-items:center}
.cl .main{position:absolute;left:200px;right:0;top:0;bottom:0}
.cl .greet{position:absolute;left:0;right:0;top:230px;text-align:center;font-family:"Liberation Serif",Georgia,serif;font-size:44px;display:flex;justify-content:center;align-items:center;gap:14px}
.cl .box{position:absolute;left:30px;right:30px;top:340px;min-height:170px;background:#30302E;border:2px solid #45443f;border-radius:24px;padding:20px 22px 76px;font-size:24px;line-height:1.4}
.cl .plus{position:absolute;left:16px;bottom:14px;width:48px;height:48px;border-radius:14px;border:2px solid #4a4944;display:grid;place-items:center;font-size:32px;font-weight:300}
.cl .send{position:absolute;right:16px;bottom:14px;width:48px;height:48px;border-radius:14px;background:#D97757;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:10px;background:#3a3935;border:2px solid #4d4c47;border-radius:14px;padding:8px 14px 8px 8px;font-size:19px;margin-bottom:12px}
.chip i{width:38px;height:44px;border-radius:7px;background:#1F9D55;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:#fff}
.umsg{position:absolute;right:26px;top:26px;max-width:600px;background:#141413;border-radius:20px;padding:16px 20px;font-size:20px;line-height:1.35}
.resp{position:absolute;left:30px;right:30px;top:250px;font-size:20.5px;line-height:1.4}
.resp h5{font-size:22px;color:#fff;margin:10px 0 4px}
.resp .r{opacity:0}
.resp b{color:#D97757}
.caret{display:inline-block;width:3px;height:26px;background:#ECEAE2;vertical-align:-5px;margin-left:2px}
/* captions */
#cap{position:absolute;left:60px;width:900px;top:1395px;height:300px}
#cap .chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px 46px}
#cap .w{display:inline-block;font-weight:900;font-size:80px;line-height:1.08;text-transform:uppercase;letter-spacing:-.02em;color:#fff;
  -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 7px 0 rgba(0,0,0,.6);transform-origin:50% 60%}
#who{position:absolute;left:0;right:0;top:1340px;display:flex;justify-content:center}
#who span{font-weight:900;font-size:30px;letter-spacing:.14em;padding:6px 18px;border-radius:10px;color:#000}
#disc{position:absolute;left:0;right:0;top:182px;text-align:center;font-size:24px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.85);opacity:0}
#disc span{background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2)}
#cta{position:absolute;inset:0;pointer-events:none}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.03em;line-height:.95;text-transform:uppercase;opacity:0}
</style></head><body>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pulse = (t, T, w = .25) => Math.exp(-Math.pow((t - T) / w, 2));
const EV = []; const ev = (type, t, x = {}) => EV.push(Object.assign({ type, t: +(+t).toFixed(3) }, x));
let TL, WORDS, LINES, DUR;
const norm = s => s.toLowerCase().replace(/[^a-z0-9']/g, '');
const Ln = id => LINES.find(l => l.id === id);
function Wd(id, pre, n = 0) { const li = Ln(id).i; const ws = WORDS.filter(w => w.li === li && norm(w.w).startsWith(pre)); if (!ws[n]) throw Error('word ' + id + ' ' + pre); return ws[n]; }
function typed(s, t, a, b) { return s.slice(0, Math.round(s.length * p01(t, a, b))); }
const caret = t => `<span class="caret" style="opacity:${Math.floor(t * 2.4) % 2 ? 0 : 1}"></span>`;
// keyframe interpolation: keys=[[t,val|obj],...], smooth over `ease` seconds after each key
function KF(keys, t, ease = .3) {
  let cur = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const [tk, v] = keys[i]; if (t < tk) break; const u = sstep(p01(t, tk, tk + ease));
    if (typeof v === 'number') cur = lerp(cur, v, u); else { const o = {}; for (const k in v) o[k] = lerp(cur[k] ?? 0, v[k], u); cur = Object.assign({}, cur, o); } }
  return cur;
}
const S = (svg, html) => { svg.insertAdjacentHTML('beforeend', html); };

// ───────────── WORLD ─────────────
const C0 = { x: 540, y: 1060 };
const LAYERS = [['Lsky', .06, .05], ['Lcity', .16, .12], ['Lroof', .6, .55], ['Lbg', .78, .75], ['Lmain', 1, 1], ['Lfg', 1.2, 1.2]];

function buildWorld() {
  const sky = $('#sky'), city = $('#city'), roof = $('#roof');
  S(sky, `<defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">

    <g id="clouds">${Array.from({ length: 7 }, (_, i) => `<ellipse cx="${hash(i + 70) * 1800 - 400}" cy="${450 + hash(i + 80) * 380}" rx="${220 + hash(i) * 260}" ry="${16 + hash(i + 4) * 18}" fill="#FFB38A" opacity="${.12 + hash(i + 6) * .15}"/>`).join('')}</g>
    <g id="plane"><circle r="3" fill="#fff"/><circle r="2.5" cx="-10" fill="#ff4040"/></g>`);
  cloudsG = $('#clouds'); planeG = $('#plane');
  // city: far haze band + landmarks
  let far = '', near = '', wins = '';
  for (let i = 0; i < 46; i++) { const x = -500 + i * 48, h = 60 + hash(i + 200) * 150; far += `<rect x="${x}" y="${1000 - h}" width="${40 + hash(i) * 20}" height="${h + 40}" fill="#5A3A6E" opacity=".75"/>`; }
  for (let i = 0; i < 34; i++) { const x = -480 + i * 62, h = 90 + hash(i + 300) * 220, w = 46 + hash(i + 5) * 26; if (x > 500 && x < 620) continue;
    near += `<rect x="${x}" y="${1000 - h}" width="${w}" height="${h + 40}" fill="#22183A"/>`;

  winSel = $$('.win', city); eyeG = $('#eye', city); carsG = $('#cars', city);
  carsG.innerHTML = Array.from({ length: 16 }, (_, i) => `<g class="car"><rect x="-9" y="-3" width="18" height="5" rx="2" fill="#111"/><circle cx="${i % 2 ? 8 : -8}" cy="-1" r="2.6" fill="${i % 2 ? '#fff6d0' : '#ff3030'}"/></g>`).join('');

  let deck = ''; for (let i = 0; i < 26; i++) { const y = 1090 + Math.pow(i / 26, 1.6) * 1100; deck += `<line x1="-600" y1="${y}" x2="1700" y2="${y}" stroke="#2b1d1a" stroke-width="${1 + i / 10}"/>`; }

    <rect x="-600" y="1085" width="2300" height="1200" fill="url(#deckG)"/>${deck}
    <rect x="-600" y="1010" width="2300" height="80" fill="url(#glassG)"/>
    <rect x="-600" y="1006" width="2300" height="7" fill="#C9A86A"/><rect x="-600" y="1086" width="2300" height="5" fill="#2a2018"/>
    ${Array.from({ length: 14 }, (_, i) => `<rect x="${-560 + i * 170}" y="1010" width="4" height="80" fill="#C9A86A" opacity=".7"/>`).join('')}

    <rect x="-330" y="380" width="9" height="720" fill="#18110e"/><rect x="1395" y="380" width="9" height="720" fill="#18110e"/>

  lightsSel = $$('.bulb', roof);

// ───────────── CAST ─────────────
let CH = {}, GUESTS = [], WAITER, LAPIT, LAPRU, BAG;
function guestLook(i, gender) {
  const skins = [['#F1C9A8', '#D7A786'], ['#C98E66', '#A8704C'], ['#8D5A3B', '#6E4329'], ['#E8B996', '#C99572'], ['#F5D2B8', '#DDB091']];
  const hairs = [['#1a1a1a', '#3a3a3a'], ['#6b4a2e', '#8a6440'], ['#c9a46a', '#e0c08a'], ['#3a1f14', '#5a3222'], ['#888', '#aaa']];
  const sk = skins[i % 5], hr = hairs[(i * 3) % 5];
  if (gender === 'f') return { gender: 'f', skin: sk[0], skinSh: sk[1], hair: hr[0], hairHi: hr[1], style: i % 2 ? 'long' : 'bun', eye: '#4a3a2a', brow: hr[0],
    dress: ['#7A1F3D', '#1F3A7A', '#C9A13B', '#222', '#5A2A7A'][i % 5], dressHi: ['#9A3A5A', '#3A5AA0', '#E9C25A', '#444', '#7A4A9A'][i % 5], lip: '#B5404A', earrings: i % 2 == 0, necklace: false };
  return { gender: 'm', skin: sk[0], skinSh: sk[1], hair: hr[0], hairHi: hr[1], style: i % 2 ? 'short' : 'side', eye: '#4a3a2a', brow: hr[0],
    suit: ['#2a2a2a', '#3a3f4a', '#4a3a2a', '#1a2a3a', '#5a5a5a'][i % 5], suitHi: ['#444', '#5a606c', '#6a5a4a', '#2a4060', '#777'][i % 5], shirt: '#eee', tie: i % 3 ? '#552' : null, lip: '#a86a5a', stubble: i % 2 ? .15 : 0 };
}
function buildCast() {

  G.forEach(([x, y, s, g, dir], i) => { const c = new Char('g' + i, guestLook(i + 1, g), gRow); GUESTS.push({ c, x, y, s, dir, i }); });
  S(bg, `${[[137, 1150, .58], [945, 1152, .58], [450, 1092, .43], [688, 1090, .43]].map(([x, y, s]) => `<g transform="translate(${x},${y}) scale(${s})">
      <rect x="-120" y="-30" width="240" height="210" rx="8" fill="#ece6dc"/><rect x="-120" y="-40" width="240" height="22" rx="6" fill="#fff"/>

      <path d="M 50,-40 l 0,-50 l -14,-30 l 28,0 l -14,30" stroke="#fff" stroke-width="3" fill="rgba(140,20,40,.6)"/></g>`).join('')}`);
  WAITER = new Char('waiter', { gender: 'm', skin: '#D8A27C', skinSh: '#B9805A', hair: '#222', hairHi: '#444', style: 'short', eye: '#3a2a1a', brow: '#222', suit: '#111', suitHi: '#2a2a2a', shirt: '#f4f4f4', tie: '#000', lip: '#a86a5a', stubble: 0 }, bg);

  // main: chairs, characters (body), table, arms, props
  S(main, `<defs><linearGradient id="clothG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF7F2"/><stop offset="1" stop-color="#CFC6B8"/></linearGradient>

     <radialGradient id="candleG"><stop offset="0" stop-color="#FFE2A0" stop-opacity=".9"/><stop offset="1" stop-color="#FF9A40" stop-opacity="0"/></radialGradient>

      <ellipse cx="540" cy="1352" rx="500" ry="8" fill="rgba(0,0,0,.08)"/>

    </g>
    <g id="arms"></g>

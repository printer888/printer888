<!doctype html>
<html><head><meta charset="utf-8">
<title>Claude from Zero EP1</title>
<style>
:root{--bg:#05060B;--blue:#2E9BFF;--blue2:#00D1FF;--purple:#A35CFF;--orange:#FF7A1A;--claude:#D97757;--white:#fff;
  --app:#262624;--side:#1E1D1B;--inp:#30302E;--ink:#ECEAE2;--mut:#9C9A92;--line:#3B3A37}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#bg{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity,filter}
.cam{position:absolute;inset:0;transform-origin:540px 700px}
.abs{position:absolute}
.mega{font-weight:900;letter-spacing:-0.04em;line-height:.9;text-transform:uppercase}
.grad-o{background:linear-gradient(90deg,#FFB020,#FF5A1F 55%,#FF2E63);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-p{background:linear-gradient(90deg,#7DB7FF,#A35CFF 60%,#FF6AD5);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-b{background:linear-gradient(90deg,#00D1FF,#2E9BFF 50%,#A35CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:rgba(18,20,30,.82);border:2px solid rgba(255,255,255,.10);border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(46,155,255,.08) inset}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:800}
/* captions */
#cap{position:absolute;left:70px;width:880px;top:1235px;height:250px;display:flex;align-items:center;justify-content:center}
#cap .chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px 40px}
#cap .w{display:inline-block;font-weight:900;font-size:86px;line-height:1.08;text-transform:uppercase;letter-spacing:-0.02em;color:#fff;
  -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.6);transform-origin:50% 60%}
/* step badge */
#step{position:absolute;left:0;right:0;top:206px;display:flex;justify-content:center;opacity:0}
#step .pill{padding:16px 36px 16px 18px;font-size:44px;background:linear-gradient(90deg,#FF7A1A,#FF3D6E);box-shadow:0 12px 40px rgba(255,90,40,.45)}
#step .num{width:62px;height:62px;border-radius:50%;background:#fff;color:#FF5A1F;display:grid;place-items:center;font-weight:900;font-size:40px}
#series{position:absolute;left:60px;top:120px;font-size:28px;font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.75);display:flex;gap:12px;align-items:center;opacity:0}
#series b{color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));padding:4px 14px;border-radius:10px;letter-spacing:.05em}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
/* cursor */
.cursor{position:absolute;width:74px;height:74px;left:0;top:0;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;border:6px solid var(--blue2);z-index:49;opacity:0;left:0;top:0}
/* app mock */
.app{position:absolute;left:44px;top:300px;width:992px;height:880px;background:var(--app);border-radius:34px;overflow:hidden;border:2px solid #3a3936;
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 80px rgba(163,92,255,.12)}
.app .side{position:absolute;left:0;top:0;bottom:0;width:236px;background:var(--side);border-right:2px solid #2d2c2a;padding:30px 20px;color:var(--ink)}
.app .brand{display:flex;align-items:center;gap:12px;font-family:"Liberation Serif",Georgia,serif;font-size:36px;margin-bottom:34px}
.app .nav{display:flex;align-items:center;gap:14px;font-size:25px;padding:14px 12px;border-radius:14px;color:var(--ink)}
.app .nav .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.app .nav.new .ic{background:var(--claude);color:#fff;font-weight:700;font-size:28px}
.app .rec{font-size:20px;color:var(--mut);margin:26px 12px 12px}
.app .sk{height:14px;border-radius:7px;background:#34332f;margin:16px 12px}
.app .main{position:absolute;left:236px;right:0;top:0;bottom:0}
.app .greet{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:"Liberation Serif",Georgia,serif;font-size:50px;color:var(--ink);display:flex;justify-content:center;align-items:center;gap:18px}
.app .box{position:absolute;left:40px;right:40px;top:380px;min-height:190px;background:var(--inp);border:2px solid #45443f;border-radius:28px;padding:24px 26px 86px;color:var(--ink);font-size:30px;line-height:1.38}
.app .ph{color:#8b897f}
.app .plus{position:absolute;left:20px;bottom:18px;width:56px;height:56px;border-radius:16px;border:2px solid #4a4944;display:grid;place-items:center;color:var(--ink);font-size:38px;font-weight:300}

.menu{position:absolute;background:#2f2e2b;border:2px solid #4a4944;border-radius:20px;padding:10px;width:400px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0}
.menu .mi{display:flex;gap:16px;align-items:center;font-size:25px;color:var(--ink);padding:16px 16px;border-radius:12px}
.seg{border-radius:6px;padding:0 2px}
.tag{position:absolute;font-size:26px;font-weight:900;letter-spacing:.06em;padding:8px 18px;border-radius:12px;color:#fff;opacity:0;white-space:nowrap}
.caret{display:inline-block;width:3px;height:34px;background:var(--ink);vertical-align:-6px;margin-left:2px}
.umsg{position:absolute;right:40px;top:40px;max-width:620px;background:#141413;border-radius:24px;padding:20px 24px;color:var(--ink);font-size:26px;line-height:1.35;opacity:0}
.resp{position:absolute;left:40px;right:40px;top:235px;color:var(--ink);font-size:25px;line-height:1.36;opacity:0}
.resp h4{font-size:30px;margin:6px 0 8px;font-weight:800;color:#fff}
.resp .li{display:flex;gap:12px;opacity:0}
.resp .li b{color:var(--claude)}
/* browser */
.browser{position:absolute;left:70px;top:330px;width:940px;height:830px;border-radius:30px;overflow:hidden;background:#F7F6F1;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 90px rgba(46,155,255,.18)}
.browser .bar{height:96px;background:#DEDDD7;display:flex;align-items:center;gap:14px;padding:0 26px}
.browser .dot{width:20px;height:20px;border-radius:50%}
.browser .url{flex:1;margin-left:20px;height:58px;border-radius:29px;background:#fff;display:flex;align-items:center;padding:0 26px;font-size:30px;color:#222;gap:14px}
.browser .load{position:absolute;left:0;top:96px;height:6px;background:linear-gradient(90deg,var(--blue),var(--purple));width:0}
.browser .page{position:absolute;left:0;right:0;top:102px;bottom:0}
.lg{position:absolute;left:150px;right:150px;top:70px;text-align:center;color:#1F1E1D;opacity:0}
.lg .wm{font-family:"Liberation Serif",Georgia,serif;font-size:72px;display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:70px}
.btnL{height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:32px;font-weight:600;margin-bottom:22px}
.btnL.g{background:#fff;border:2px solid #d4d2c8}
.btnL.e{background:#1F1E1D;color:#fff}
.inpL{height:96px;border-radius:20px;border:2px solid #d4d2c8;background:#fff;display:flex;align-items:center;padding:0 28px;font-size:32px;color:#1F1E1D;margin-bottom:22px;text-align:left}
.orL{color:#8a887e;font-size:26px;margin:4px 0 26px;font-weight:600}
.ring{position:absolute;border-radius:24px;border:6px solid var(--blue2);box-shadow:0 0 30px var(--blue2),inset 0 0 20px rgba(0,209,255,.3);opacity:0}
.arrow{position:absolute;opacity:0}
.toast{position:absolute;left:150px;right:150px;top:640px;background:#fff;border-radius:24px;padding:24px 28px;display:flex;gap:22px;align-items:center;color:#1F1E1D;font-size:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);opacity:0}
.stamp{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;opacity:0}
.stamp .big{font-size:150px;font-weight:900;letter-spacing:-.03em;padding:26px 56px;border:12px solid #3DDC84;border-radius:40px;color:#3DDC84;background:rgba(5,30,15,.85);box-shadow:0 0 80px rgba(61,220,132,.45);transform:rotate(-6deg);line-height:1}
.stamp .sub{margin-top:36px;font-size:54px;font-weight:900;background:#fff;color:#111;padding:10px 28px;border-radius:16px}
/* chips */
.chip{position:absolute;width:420px;height:170px;display:flex;align-items:center;gap:24px;padding:0 30px;font-size:44px;font-weight:900;border-radius:34px;opacity:0}
.chip .ico{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;flex:none}
.ucard{position:absolute;width:450px;height:330px;border-radius:36px;padding:30px;opacity:0}
.ucard .t{font-size:42px;font-weight:900;margin-top:18px;line-height:1.05}
.ucard .ico{width:90px;height:90px;border-radius:24px;display:grid;place-items:center}
.ucard .ln{height:14px;border-radius:7px;background:rgba(255,255,255,.18);margin-top:16px}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="scenes"></div>
<div id="series">CLAUDE FROM ZERO <b>EP 1</b></div>
<div id="step"><div class="pill"><div class="num">1</div><span>STEP 1</span></div></div>
<div id="cap"></div>
<div id="flash"></div>
</div>
<script>
// ───────────────────────── helpers ─────────────────────────
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3);
const ei=x=>Math.pow(clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eel=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const pulse=(t,T,w=.25)=>Math.exp(-Math.pow((t-T)/w,2));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const EV=[]; const ev=(type,t,extra={})=>EV.push(Object.assign({type,t:+t.toFixed(3)},extra));

function spark(size,color='#D97757'){
  let s=`<svg width="${size}" height="${size}" viewBox="-50 -50 100 100">`;
  const n=11;
  for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+0.2*rnd(i);const L=[38,30,44,33,40,29,42,35,31,43,36][i];
    s+=`<line x1="${Math.cos(a)*6}" y1="${Math.sin(a)*6}" x2="${Math.cos(a)*L}" y2="${Math.sin(a)*L}" stroke="${color}" stroke-width="9" stroke-linecap="round"/>`}
  return s+'</svg>'}
const ICON={
 pen:`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
 bulb:`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>`,
 doc:`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>`,
 brain:`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg>`,
 mail:`<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>`,
 list:`<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 2 2 4-4M3 13l2 2 4-4M3 20l2 2 4-4"/><path d="M13 6h8M13 13h8M13 20h8"/></svg>`,
 bolt:`<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>`,
 cap:`<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>`,
 up:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
 clip:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ECEAE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>`,
 drive:`<svg width="34" height="34" viewBox="0 0 24 24"><path d="M8 3h8l6 10h-8Z" fill="#FFC107"/><path d="M2 13 8 3l4 7-6 10Z" fill="#1E88E5"/><path d="M6 20h12l4-7H10Z" fill="#43A047"/></svg>`,
 loop:`<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>`,
 check:`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
};
const G=`<svg width="40" height="40" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
const CURSOR=`<svg viewBox="0 0 24 24" width="74" height="74"><path d="M4 2.5v17.2l4.6-4.3 2.9 6.6 3.1-1.4-2.9-6.4 6.3-.4Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const ARROW=(c='#00D1FF')=>`<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px ${c})"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

// ───────────────────────── timeline ─────────────────────────
let D, WORDS, SENT, DUR;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9.']/g,'').replace(/\.$/,'');
function S(id){return SENT.find(s=>s.id===id)}
function W(id,prefix,nth=0){const si=S(id).i;const ws=WORDS.filter(w=>w.si===si&&norm(w.w).startsWith(prefix.toLowerCase()));
  if(!ws[nth]) throw new Error('word not found '+id+' '+prefix); return ws[nth]}

// typing helper: returns visible substring length
function typed(text,t,t0,t1){return text.slice(0,Math.round(text.length*p(t,t0,t1)))}
function caret(t){return (Math.floor(t*2.2)%2===0)?'<span class="caret"></span>':'<span class="caret" style="opacity:0"></span>'}

// cursor path: keys=[[t,x,y],...], clicks=[t...]
function cursorAt(keys,t){if(t<=keys[0][0])return keys[0];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0]){const u=eio(p(t,a[0],b[0]));return [t,lerp(a[1],b[1],u),lerp(a[2],b[2],u)]}}return keys[keys.length-1]}
function drawCursor(cur,rip,keys,clicks,t,vis){const [,x,y]=cursorAt(keys,t);let sc=1,ro=0,rs=0;
  for(const c of clicks){const d=t-c; if(d>-0.08&&d<0.12) sc=Math.min(sc,0.82); if(d>=0&&d<0.45){ro=1-d/0.45;rs=1+d*7}}
  cur.style.opacity=vis;cur.style.transform=`translate(${x-12}px,${y-8}px) scale(${sc})`;
  rip.style.opacity=ro*vis;rip.style.transform=`translate(${x-20}px,${y-20}px) scale(${rs})`}
function rel(el,root){const a=el.getBoundingClientRect(),b=root.getBoundingClientRect(),k=b.width/1080;return {x:(a.left-b.left+a.width/2)/k,y:(a.top-b.top+a.height/2)/k,w:a.width/k,h:a.height/k,l:(a.left-b.left)/k,t:(a.top-b.top)/k}}

// ───────────────────────── scenes ─────────────────────────
const SC=[];
function scene(id,html){const el=document.createElement('div');el.className='scene';el.id='sc-'+id;el.innerHTML=`<div class="cam">${html}</div>`;$('#scenes').appendChild(el);return el}
function appHTML(k){return `<div class="app" id="${k}-app">
  <div class="side"><div class="brand">${spark(44)}Claude</div>
   <div class="nav new"><div class="ic">+</div>New chat</div>
   <div class="nav"><div class="ic" style="border:2px solid #6b6962;border-radius:8px;width:28px;height:28px"></div>Chats</div>
   <div class="nav"><div class="ic" style="border:2px solid #6b6962;width:30px;height:24px;border-radius:5px"></div>Projects</div>
   <div class="rec">Recents</div><div class="sk" style="width:80%"></div><div class="sk" style="width:65%"></div><div class="sk" style="width:72%"></div><div class="sk" style="width:55%"></div></div>
  <div class="main" id="${k}-main">
   <div class="greet" id="${k}-greet">${spark(60)}<span>Good evening, Alex</span></div>
   <div class="umsg" id="${k}-umsg"></div>
   <div class="resp" id="${k}-resp"></div>
   <div class="box" id="${k}-box"><div class="files" id="${k}-files"></div><div id="${k}-txt"><span class="ph">How can I help you today?</span></div>
     <div class="plus" id="${k}-plus">+</div><div class="send" id="${k}-send">${ICON.up}</div></div>
  </div></div>`}

function build(){
 const T={}; for(const s of SENT) T[s.id]=s;
 const END=DUR;
 // scene windows
 const win=[
  ['hook',0,T.intro.s-0.12],
  ['intro',T.intro.s-0.12,T.step1.s-0.14],
  ['web',T.step1.s-0.14,T.step2.s-0.15],
  ['chat',T.step2.s-0.15,T.step3.s-0.15],
  ['upload',T.step3.s-0.15,T.uses.s-0.13],
  ['uses',T.uses.s-0.13,T.tip.s-0.15],
  ['tip',T.tip.s-0.15,T.cta.s-0.15],
  ['cta',T.cta.s-0.15,END+1]];
 const ws={};win.forEach(([id,a,b])=>ws[id]=[a,b]);
 win.slice(1).forEach(([id,a])=>{ev('whoosh',a-0.12)});

  CH.forEach((c,i)=>{const nx=CH[i+1];const last=c.words[c.words.length-1];
    c.end=nx?Math.min(nx.s, last.e+0.7):last.e+1.0; if(nx&&nx.s-last.e>0.7)c.end=last.e+0.45;

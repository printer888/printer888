<!doctype html>
<html><head><meta charset="utf-8"><title>Kimchi Short Renderer</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Deterministic frame renderer: window.renderAt(t) draws the exact frame for time t (seconds).
   Everything is procedural (no external images) and seeded, so renders are reproducible. */
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let D = null; // data: {tl, words, vis}
const FONT = '"Inter Display", "Inter", sans-serif';
const MONO = '"JetBrains Mono", monospace';
const C = { navy:'#070a18', blue:'#2fd3ff', purple:'#8b5cff', orange:'#ff8a3d', gold:'#ffc83d', yellow:'#ffe14d',
            red:'#ff3b5c', green:'#2ee59d', white:'#ffffff' };

// ---------------------------------------------------------------- math utils
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eio = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const ei = t => t*t*t;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const eel = t => t === 0 || t === 1 ? t : Math.pow(2, -10*t) * Math.sin((t*10 - .75) * (2*Math.PI/3)) + 1;
function hash(n){ n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function noise1(x){ const i = Math.floor(x), f = x - i, u = f*f*(3-2*f); return lerp(hash(i), hash(i+1), u) * 2 - 1; }
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

// ---------------------------------------------------------------- drawing utils
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function spline(pts, closed=true, tension=.5){
  const n = pts.length; ctx.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++){
    const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
    const q0 = (!closed && i === 0) ? p1 : p0, q3 = (!closed && i === n-2) ? p2 : p3;
    const c1x = p1[0] + (p2[0]-q0[0]) * tension/3, c1y = p1[1] + (p2[1]-q0[1]) * tension/3;
    const c2x = p2[0] - (q3[0]-p1[0]) * tension/3, c2y = p2[1] - (q3[1]-p1[1]) * tension/3;
    ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2[0], p2[1]);
  }
  if (closed) ctx.closePath();
}
function txt(s, x, y, size, o={}){
  ctx.save();
  ctx.font = `${o.weight||900} ${size}px ${o.font||FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.spacing !== undefined) ctx.letterSpacing = o.spacing + 'px';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.glow){ ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowSize || 40; }
  if (o.stroke){ ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.strokeW || size*.14; ctx.strokeText(s, x, y); ctx.shadowBlur = 0; }
  ctx.fillStyle = o.fill || '#fff'; ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight=900, font=FONT, spacing=0){
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function glowDot(x, y, r, col, a=1){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x-r, y-r, 2*r, 2*r); ctx.restore();
}
function withAlpha(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function camera(cx, cy, z, rot=0){ ctx.translate(W/2, H/2); ctx.rotate(rot); ctx.scale(z, z); ctx.translate(-cx, -cy); }

// ---------------------------------------------------------------- data helpers
function wordT(scene, text, nth=0, end=false){
  const c = D.words.filter(w => w.scene === scene && w.text.toLowerCase().replace(/[.,]/g,'').startsWith(text.toLowerCase()));
  const w = c[nth]; return w ? (end ? w.end : w.start) : 0;
}
function line(scene){ return D.lines.find(l => l.scene === scene); }
let visIdx = 0;
function visAt(t){
  const v = D.vis; let lo = 0, hi = v.length - 1, ans = -1;
  while (lo <= hi){ const m = (lo+hi)>>1; if (v[m][0] <= t){ ans = m; lo = m+1; } else hi = m-1; }
  if (ans < 0) return [0,0];
  const e = v[ans]; if (t > e[1] + 0.02) return [0,0];
  return [e[2], e[3]];
}
function mouthAt(t){ // smoothed viseme openness → natural lip motion
  let o = 0, r = 0, ws = 0;
  for (let k = -3; k <= 3; k++){ const w = Math.exp(-k*k/4); const v = visAt(t + k*0.016); o += v[0]*w; r += v[1]*w; ws += w; }
  return [o/ws, r/ws];
}
function speaking(t){ return D.words.some(w => t >= w.start - .05 && t <= w.end + .05); }

// ---------------------------------------------------------------- cached assets
const cache = {};
function offscreen(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), c); return c; }
function buildSkyline(){
  const layers = [];
  const specs = [
    {seed: 11, h0: 260, h1: 620, w0: 60, w1: 150, col: '#141a3a', win: .22, wc: ['#ffcf7a','#8fd8ff','#ffe9b8'], y: 1250},
    {seed: 23, h0: 340, h1: 860, w0: 90, w1: 210, col: '#0d1230', win: .3, wc: ['#ffcf7a','#b9a4ff','#ffe9b8','#7fe3ff'], y: 1300},
    {seed: 37, h0: 420, h1: 1050, w0: 140, w1: 280, col: '#080b20', win: .36, wc: ['#ffd58c','#ffe9b8','#9fd6ff'], y: 1380},
  ];
  for (const sp of specs){
    const R = rng(sp.seed), WID = 3000;
    layers.push(offscreen(WID, 1500, (g) => {
      let x = -20;
      while (x < WID){
        const bw = lerp(sp.w0, sp.w1, R()), bh = lerp(sp.h0, sp.h1, R()), top = sp.y - bh;
        const grd = g.createLinearGradient(0, top, 0, sp.y); grd.addColorStop(0, sp.col); grd.addColorStop(1, '#03040c');
        g.fillStyle = grd; g.fillRect(x, top, bw, bh + 200);
        if (R() < .3){ g.fillRect(x + bw*.4, top - 60, bw*.2, 60); g.fillRect(x + bw*.48, top - 130, 4, 70); }
        // windows
        const cw = 9 + Math.floor(R()*4), ch = 12, gx = 7, gy = 10;
        for (let wy = top + 18; wy < sp.y - 10; wy += ch + gy){
          for (let wx = x + 10; wx < x + bw - 14; wx += cw + gx){
            if (R() < sp.win){ g.globalAlpha = .45 + R()*.55; g.fillStyle = sp.wc[Math.floor(R()*sp.wc.length)]; g.fillRect(wx, wy, cw, ch); }
          }
        }
        g.globalAlpha = 1;
        x += bw + R()*14;
      }
    }));
  }
  cache.sky = layers;
}
function buildGrain(){
  cache.grain = [];
  for (let k = 0; k < 6; k++){
    const R = rng(91 + k*7);
    cache.grain.push(offscreen(540, 960, (g) => {
      const id = g.createImageData(540, 960);
      for (let i = 0; i < id.data.length; i += 4){ const v = R()*255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
      g.putImageData(id, 0, 0);
    }));
  }
}

// ---------------------------------------------------------------- backgrounds
function nightSky(t, shiftX=0, z=1){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0b2a'); g.addColorStop(.45, '#1d1450'); g.addColorStop(.75, '#3a1d5c'); g.addColorStop(1, '#ff7a45');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glowDot(W*.72 - shiftX*.1, 360, 520, 'rgba(139,92,255,.35)');
  glowDot(W*.2 - shiftX*.1, 1100, 700, 'rgba(255,122,69,.25)');
  // moon
  glowDot(820 - shiftX*.05, 300, 120, 'rgba(255,240,220,.5)');
  ctx.fillStyle = '#fff3e0'; ctx.beginPath(); ctx.arc(820 - shiftX*.05, 300, 34, 0, 7); ctx.fill();
  // stars
  const R = rng(5);
  for (let i = 0; i < 70; i++){ const x = R()*W, y = R()*700, tw = .5 + .5*Math.sin(t*2 + i); ctx.fillStyle = `rgba(255,255,255,${.25 + .5*tw*R()})`; ctx.fillRect(x - shiftX*.05, y, 2, 2); }
  // skyline layers with parallax
  const par = [.15, .3, .5];
  cache.sky.forEach((L, i) => {
    const s = 1 + (z - 1) * par[i] * .5;
    const off = ((shiftX * par[i] + t * (4 + i*2)) % 1500 + 1500) % 1500;
    ctx.save(); ctx.translate(W/2, 1300); ctx.scale(s, s); ctx.translate(-W/2, -1300);
    ctx.drawImage(L, -off - 300, 120 + i*20);
    ctx.restore();
  });
  // haze + aircraft light
  const hz = ctx.createLinearGradient(0, 1000, 0, 1500); hz.addColorStop(0, 'rgba(255,120,80,0)'); hz.addColorStop(1, 'rgba(255,120,80,.18)');
  ctx.fillStyle = hz; ctx.fillRect(0, 1000, W, 500);
  const blink = (Math.sin(t*6) > .6) ? 1 : .2;
  glowDot(((t*40 + 100) % 1400) - 150 - shiftX*.05, 520, 14, `rgba(255,80,90,${blink})`);
}

function apartment(t, camX=0, z=1){
  // window view
  nightSky(t, camX, z);
  // window mullions & frame
  ctx.fillStyle = '#05060d';
  for (const x of [262, 532, 802]) ctx.fillRect(x, 0, 16, 1370);
  ctx.fillRect(0, 470, W, 10);
  // glass reflection streaks
  ctx.save(); ctx.globalAlpha = .06; ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++){ ctx.beginPath(); const x = 100 + i*270; ctx.moveTo(x, 0); ctx.lineTo(x + 90, 0); ctx.lineTo(x - 140, 1370); ctx.lineTo(x - 200, 1370); ctx.fill(); }
  ctx.restore();
  // floor
  const fg = ctx.createLinearGradient(0, 1360, 0, H); fg.addColorStop(0, '#1a1426'); fg.addColorStop(1, '#09070f');
  ctx.fillStyle = fg; ctx.fillRect(0, 1360, W, H - 1360);
  ctx.fillStyle = '#2a1f3a'; ctx.fillRect(0, 1360, W, 8);
  // floor reflection of city
  const rg = ctx.createLinearGradient(0, 1368, 0, 1700); rg.addColorStop(0, 'rgba(139,92,255,.18)'); rg.addColorStop(1, 'rgba(139,92,255,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 1368, W, 340);
  // rug
  ctx.fillStyle = 'rgba(120,90,160,.18)'; ctx.beginPath(); ctx.ellipse(540, 1700, 520, 120, 0, 0, 7); ctx.fill();
  // floor lamp (left)
  ctx.strokeStyle = '#1c1a22'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(130, 1650); ctx.lineTo(130, 900); ctx.quadraticCurveTo(130, 820, 200, 820); ctx.stroke();
  ctx.fillStyle = '#e9c48a'; ctx.beginPath(); ctx.moveTo(165, 820); ctx.lineTo(245, 820); ctx.lineTo(260, 880); ctx.lineTo(150, 880); ctx.fill();
  glowDot(205, 900, 420, 'rgba(255,170,90,.35)');
  ctx.fillStyle = '#1c1a22'; ctx.beginPath(); ctx.ellipse(130, 1652, 60, 14, 0, 0, 7); ctx.fill();
  // plant (right)
  ctx.fillStyle = '#16131c'; rr(880, 1480, 130, 170, 18); ctx.fill();
  for (let i = 0; i < 9; i++){
    const a = -Math.PI/2 + (i - 4) * .28 + .05*Math.sin(t*1.3 + i);
    ctx.save(); ctx.translate(945, 1490); ctx.rotate(a + Math.PI/2);
    ctx.fillStyle = i % 2 ? '#123a2c' : '#0e2c22'; ctx.beginPath(); ctx.ellipse(0, -150, 30, 150, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}

// ---------------------------------------------------------------- the character (original design)
const SKIN = '#c98d68', SKIN_D = '#a8694a', SKIN_L = '#e6b08a', HAIR = '#141012', HOOD = '#1b1d27';
function blinkAt(t){
  const period = 3.3; const k = Math.floor(t / period); const off = hash(k) * 2.0; const tb = t - k*period - off;
  return (tb > 0 && tb < .16) ? Math.abs(Math.cos(tb / .16 * Math.PI)) : 1;
}
// p: {yaw, tilt, lean, mouth, round, smile, brow, browAsym, eyeOpen, lookX, lookY, arms, t, glow, glowCol, gesture}
function drawCharacter(x, y, s, p){
  const t = p.t;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.translate(0, 420); ctx.rotate(p.lean || 0); ctx.translate(0, -420);
  const breathe = Math.sin(t * 1.6) * 3;
  // ---- torso / hoodie
  ctx.save(); ctx.translate(0, breathe * .5);
  const tg = ctx.createLinearGradient(-220, 0, 220, 0);
  tg.addColorStop(0, '#2a2d3a'); tg.addColorStop(.45, HOOD); tg.addColorStop(1, '#0c0d13');
  ctx.fillStyle = tg; ctx.beginPath();
  spline([[-60,-10],[-175,30],[-215,140],[-225,420],[-120,470],[0,480],[120,470],[225,420],[215,140],[175,30],[60,-10],[0,5]], true, .7);
  ctx.fill();
  // rim light (city) on right, warm on left
  ctx.save(); ctx.clip();
  glowDot(260, 120, 200, 'rgba(47,211,255,.35)');
  glowDot(-260, 160, 220, 'rgba(255,150,90,.28)');
  // folds
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-120, 240); ctx.quadraticCurveTo(-90, 300, -130, 380); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(110, 220); ctx.quadraticCurveTo(80, 310, 120, 400); ctx.stroke();
  // kangaroo pocket
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-120, 470); ctx.lineTo(-100, 330); ctx.lineTo(100, 330); ctx.lineTo(120, 470); ctx.stroke();
  ctx.restore();
  // hood collar behind neck
  ctx.fillStyle = '#252836'; ctx.beginPath();
  spline([[-115,-5],[-80,-40],[0,-55],[80,-40],[115,-5],[70,35],[0,48],[-70,35]], true, .8); ctx.fill();
  ctx.fillStyle = '#12131a'; ctx.beginPath(); ctx.ellipse(0, 0, 62, 26, 0, 0, 7); ctx.fill();
  // drawstrings
  ctx.strokeStyle = '#d9d9e3'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const sx of [-30, 30]){ ctx.beginPath(); ctx.moveTo(sx, 30); ctx.quadraticCurveTo(sx * 1.2 + Math.sin(t*1.3)*3, 110, sx*1.1, 190); ctx.stroke();
    ctx.fillStyle = '#c0c4cf'; rr(sx*1.1 - 5, 186, 10, 22, 4); ctx.fill(); }
  // gold chain
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 4; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(-50, -2); ctx.quadraticCurveTo(0, 95, 50, -2); ctx.stroke(); ctx.setLineDash([]);
  glowDot(0, 48, 14, 'rgba(255,215,120,.9)');
  ctx.restore();

  // ---- arms (behind hands drawn later)
  drawArms(p, breathe);

  // ---- neck
  ctx.save(); ctx.translate(0, breathe * .3);
  const ng = ctx.createLinearGradient(-40, 0, 40, 0); ng.addColorStop(0, SKIN); ng.addColorStop(1, SKIN_D);
  ctx.fillStyle = ng; rr(-40, -95, 80, 100, 20); ctx.fill();
  ctx.fillStyle = 'rgba(60,25,15,.35)'; ctx.beginPath(); ctx.ellipse(0, -60, 44, 22, 0, 0, Math.PI); ctx.fill();

  // ---- head
  const yaw = p.yaw || 0, tilt = p.tilt || 0;
  ctx.translate(0, -75); ctx.rotate(tilt); ctx.translate(0, 75);
  ctx.translate(yaw * 6, 0);
  // ears
  for (const sd of [-1, 1]){
    const ex = sd * (100 - Math.max(0, sd*yaw) * 18);
    ctx.fillStyle = SKIN_D; ctx.beginPath(); ctx.ellipse(ex, -178, 20, 36, sd * .15, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(80,30,20,.35)'; ctx.beginPath(); ctx.ellipse(ex - sd*3, -176, 9, 20, sd*.15, 0, 7); ctx.fill();
  }
  // face
  const faceP = [[0,-305],[60,-298],[96,-255],[103,-185],[96,-125],[72,-72],[34,-42],[0,-36],[-34,-42],[-72,-72],[-96,-125],[-103,-185],[-96,-255],[-60,-298]];
  const fg = ctx.createRadialGradient(-35 + yaw*20, -210, 20, 0, -170, 170);
  fg.addColorStop(0, SKIN_L); fg.addColorStop(.55, SKIN); fg.addColorStop(1, SKIN_D);
  ctx.fillStyle = fg; ctx.beginPath(); spline(faceP); ctx.fill();
  ctx.save(); ctx.beginPath(); spline(faceP); ctx.clip();
  // rim light + screen glow
  glowDot(140, -170, 120, 'rgba(47,211,255,.45)');
  glowDot(-150, -190, 120, 'rgba(255,150,90,.35)');
  if (p.glow) glowDot(0, -40, 230, withAlpha(p.glowCol || '#2fd3ff', .55 * p.glow));
  // cheek blush & jaw shadow
  glowDot(-55 + yaw*20, -130, 40, 'rgba(210,90,80,.18)'); glowDot(55 + yaw*20, -130, 40, 'rgba(210,90,80,.18)');
  ctx.fillStyle = 'rgba(70,30,20,.08)'; ctx.beginPath(); ctx.ellipse(0, -36, 110, 22, 0, 0, 7); ctx.fill();
  // stubble
  ctx.fillStyle = 'rgba(40,25,25,.05)'; ctx.beginPath(); ctx.ellipse(yaw*20, -62, 62, 30, 0, 0, 7); ctx.fill();
  ctx.restore();

  const fx = yaw * 26; // feature shift
  // eyebrows
  const brow = p.brow || 0, basym = p.browAsym || 0;
  ctx.strokeStyle = HAIR; ctx.lineCap = 'round'; ctx.lineWidth = 12;
  for (const sd of [-1, 1]){
    const by = -222 - brow * 14 - (sd > 0 ? basym * 12 : 0);
    ctx.beginPath(); ctx.moveTo(fx + sd*18, by + 4 - brow*3); ctx.quadraticCurveTo(fx + sd*42, by - 10, fx + sd*68, by + 2 + brow*2); ctx.stroke();
  }
  // eyes
  const open = (p.eyeOpen ?? 1) * blinkAt(t + (p.blinkOff||0));
  const lx = (p.lookX || 0) * 7, ly = (p.lookY || 0) * 6;
  for (const sd of [-1, 1]){
    const ex = fx + sd * 42, ey = -186;
    const eh = 15 * open + 1;
    ctx.save(); ctx.beginPath(); ctx.moveTo(ex - 24, ey); ctx.quadraticCurveTo(ex, ey - eh*1.4, ex + 24, ey); ctx.quadraticCurveTo(ex, ey + eh, ex - 24, ey); ctx.closePath();
    ctx.fillStyle = '#f5efe8'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#3b2416'; ctx.beginPath(); ctx.arc(ex + lx, ey + ly - 1, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#0b0605'; ctx.beginPath(); ctx.arc(ex + lx, ey + ly - 1, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + lx + 4, ey + ly - 5, 3, 0, 7); ctx.fill();
    if (p.glow){ ctx.fillStyle = withAlpha(p.glowCol || '#2fd3ff', .5*p.glow); ctx.beginPath(); ctx.arc(ex + lx - 3, ey + ly + 3, 2.5, 0, 7); ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle = '#1a0f0c'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(ex - 26, ey + 1); ctx.quadraticCurveTo(ex, ey - eh*1.45, ex + 26, ey - 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,40,30,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ex - 20, ey + eh*.9 + 6); ctx.quadraticCurveTo(ex, ey + eh + 10, ex + 20, ey + eh*.9 + 6); ctx.stroke();
  }
  // nose
  ctx.strokeStyle = 'rgba(120,60,40,.55)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(fx + 6, -185); ctx.quadraticCurveTo(fx + 14, -150, fx + 8, -132); ctx.stroke();
  ctx.fillStyle = 'rgba(90,40,30,.45)';
  ctx.beginPath(); ctx.ellipse(fx - 12, -126, 8, 5, .3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(fx + 14, -126, 8, 5, -.3, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,190,.35)'; ctx.beginPath(); ctx.ellipse(fx + 2, -142, 6, 10, 0, 0, 7); ctx.fill();
  // mouth
  const m = clamp(p.mouth || 0), rd = clamp(p.round || 0), sm = p.smile || 0;
  const mw = 30 + sm * 7 - rd * 9, my = -88;
  const cornerY = my - sm * 9;
  const oh = m * 26;
  ctx.save(); ctx.translate(fx * .9, 0);
  if (oh > 1.5){
    ctx.fillStyle = '#3a0f12'; ctx.beginPath();
    ctx.moveTo(-mw, cornerY); ctx.quadraticCurveTo(0, my - 6 - sm*4, mw, cornerY);
    ctx.quadraticCurveTo(0, my + oh * 1.5 + 4, -mw, cornerY); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#f4efe9'; ctx.fillRect(-mw, my - 12, mw*2, 9 + Math.min(oh*.25, 5));
    ctx.fillStyle = '#c45a62'; ctx.beginPath(); ctx.ellipse(0, my + oh*1.1, mw*.6, oh*.45, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // lips
  ctx.strokeStyle = '#8e4a42'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-mw, cornerY); ctx.quadraticCurveTo(-mw*.4, my - 7, 0, my - 4); ctx.quadraticCurveTo(mw*.4, my - 7, mw, cornerY); ctx.stroke();
  ctx.fillStyle = 'rgba(160,80,70,.55)';

    const xx = 30 + i*cw + cw/2;
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xx, cy0 + ch*(1-hi)); ctx.lineTo(xx, cy0 + ch*(1-lo)); ctx.stroke();

  ctx.restore();
}

// ---------------------------------------------------------------- subtitles (word-level karaoke)
let PAGES = [];
function buildPages(){
  PAGES = [];
  const byLine = {};
  D.words.forEach(w => (byLine[w.line] = byLine[w.line] || []).push(w));
  for (const ln of Object.keys(byLine)){
    const ws = byLine[ln]; let cur = [], chars = 0;
    ws.forEach((w, i) => {
      cur.push(w); chars += w.text.length + 1;
      const brk = /[.,!?]$/.test(w.text) || chars > 17 || cur.length >= 4;
      const nxt = ws[i+1];
      if (brk && !(nxt && cur.length === 1 && !/[.,!?]$/.test(w.text)) || !nxt){ PAGES.push(cur); cur = []; chars = 0; }
    });
  }
}
const HIDE_SUBS = new Set(['name_card', 'fmd', 'end_card']);
function subtitles(t, shot){
  if (HIDE_SUBS.has(shot.type)) return;
  let page = null, pi = -1;
  for (let i = 0; i < PAGES.length; i++){
    const pg = PAGES[i], st = pg[0].start - .06, nx = PAGES[i+1];
    const en = nx ? Math.min(nx[0].start - .06, pg[pg.length-1].end + .7) : pg[pg.length-1].end + .7;
    if (t >= st && t < en){ page = pg; pi = i; break; }
  }
  if (!page) return;
  const size = 78, y = 1330;
  const items = page.map(w => ({w, s: w.text.toUpperCase(), wd: measure(w.text.toUpperCase(), size, 900, FONT, 1)}));
  const gap = 34; const total = items.reduce((a, b) => a + b.wd, 0) + gap*(items.length-1);
  // wrap to 2 lines if too wide
  const rows = [[]]; let rw = 0;
  items.forEach(it => { if (rw + it.wd > 880 && rows[rows.length-1].length){ rows.push([]); rw = 0; } rows[rows.length-1].push(it); rw += it.wd + gap; });
  const pin = eback(clamp((t - (page[0].start - .06)) / .16));
  rows.forEach((row, ri) => {
    const rwid = row.reduce((a, b) => a + b.wd, 0) + gap*(row.length-1);
    let x = 540 - rwid/2; const yy = y + (ri - (rows.length-1)/2) * (size*1.15);
    row.forEach(it => {
      const w = it.w; const active = t >= w.start - .03 && t < w.end + .05;
      const spoken = t >= w.start - .03;
      const k = active ? eback(clamp((t - w.start + .03) / .12)) : 0;
      const sc = (active ? lerp(1, 1.14, k) : 1) * lerp(.85, 1, pin);
      const cx = x + it.wd/2;
      ctx.save(); ctx.translate(cx, yy); ctx.scale(sc, sc);
      if (active && !w.kw){ ctx.fillStyle = 'rgba(47,140,255,.95)'; rr(-it.wd/2 - 14, -size*.62, it.wd + 28, size*1.22, 18); ctx.fill(); }
      const fill = w.kw ? C.yellow : '#ffffff';
      txt(it.s, 0, 2, size, {fill, stroke: 'rgba(0,0,0,.85)', strokeW: 14, spacing: 1, alpha: spoken ? 1 : .55,
        glow: (active && w.kw) ? 'rgba(255,225,77,.9)' : null, glowSize: 30});
      ctx.restore();
      x += it.wd + gap;
    });
  });
}

function shotAt(t){ const sh = D.tl.shots; for (let i = sh.length - 1; i >= 0; i--) if (t >= sh[i].start) return [sh[i], i]; return [sh[0], 0]; }
function drawShot(shot, t){
  const u = t - shot.start, p = clamp(u / (shot.end - shot.start));
  ctx.save(); SHOTS[shot.type](t, u, p, shot); ctx.restore();
}

window.renderAt = function(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const [shot, idx] = shotAt(t);
  const u = t - shot.start;
  // transition-in: zoom punch + whip + flash
  const TR = .22;
  const k = idx > 0 ? clamp(u / TR) : 1;
  ctx.save();
  if (k < 1){
    const e = eo(k); const z = lerp(1.12, 1, e); const dir = idx % 2 ? 1 : -1;
    ctx.translate(W/2 + dir * (1-e) * 160, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2);
  }
  drawShot(shot, t);
  ctx.restore();
  if (k < 1){
    // motion-blur ghost of previous shot fading out
    const prev = D.tl.shots[idx-1];
    ctx.save(); ctx.globalAlpha = (1 - eo(k)) * .55; const dir = idx % 2 ? 1 : -1;
    ctx.translate(-dir * eo(k) * 300, 0); drawShot(prev, Math.min(t, prev.end - 1e-3)); ctx.restore();
    const fl = (1 - k) * .3; ctx.fillStyle = `rgba(200,220,255,${fl})`; ctx.fillRect(0, 0, W, H);
  }
  grade(t);
  subtitles(t, shot);
  overlays(t, shot);
  // final fade
  const fo = inv(D.tl.duration - .5, D.tl.duration, t); if (fo > 0){ ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
  const fi = 1 - inv(0, .25, t); if (fi > 0){ ctx.fillStyle = `rgba(0,0,0,${fi})`; ctx.fillRect(0, 0, W, H); }
};
